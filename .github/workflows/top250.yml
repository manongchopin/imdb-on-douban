name: update-top250

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 重新生成 Top 250 快照（电影 + 剧集）
        run: node tools/update-top250.mjs

      - name: 重建华语电影 Top 100
        # IMDb 的 GraphQL 偶尔抽风，这一步失败不阻塞榜单更新
        continue-on-error: true
        run: node tools/build-chinese-top100.mjs

      - name: 有变化才提交
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "榜单没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: 更新 IMDb 榜单数据（Top 250 + 华语 Top 100）"
          git push
